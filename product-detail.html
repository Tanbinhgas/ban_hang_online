<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm - GearHub</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm fixed-top"
    >
      <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="index.html">GearHub</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <form class="d-flex mx-auto my-2 my-lg-0 w-50">
            <input
              class="form-control me-2 rounded-pill"
              type="search"
              placeholder="Tìm sản phẩm..."
              aria-label="Search"
            />
            <button class="btn btn-outline-light rounded-pill" type="submit">
              <i class="fas fa-search"></i>
            </button>
          </form>

          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">Catalog</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About / Stats</a>
            </li>
            <li class="nav-item d-none">
              <a class="nav-link" id="warehouseLink" href="warehouse.html"
                >Kho hàng</a
              >
            </li>
          </ul>

          <ul class="navbar-nav ms-3">
            <li class="nav-item">
              <a class="nav-link" href="#" id="cartBtn">
                <i class="fas fa-shopping-cart me-1"></i>Giỏ hàng
                <span class="badge bg-danger rounded-pill" id="cartCount"
                  >0</span
                >
              </a>
            </li>
          </ul>

          <ul class="navbar-nav ms-3" id="authButtons">
            <li class="nav-item">
              <a class="nav-link" href="#" id="loginBtn"
                ><i class="fas fa-sign-in-alt me-1"></i>Đăng nhập</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" id="registerBtn"
                ><i class="fas fa-user-plus me-1"></i>Đăng ký</a
              >
            </li>
          </ul>

          <ul class="navbar-nav ms-3 d-none" id="userInfo">
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="userDropdown"
                role="button"
                data-bs-toggle="dropdown"
              >
                <i class="fas fa-user-circle me-1"></i
                ><span id="userName">User</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="#" onclick="showProfile()"
                    ><i class="fas fa-user me-2"></i>Hồ sơ</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="#" onclick="showMyOrders()"
                    ><i class="fas fa-shopping-bag me-2"></i>Đơn hàng của tôi</a
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item text-danger" href="#" id="logoutBtn"
                    ><i class="fas fa-sign-out-alt me-2"></i>Đăng xuất</a
                  >
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container-fluid mt-5 pt-5">
      <div class="row">
        <div class="col-12">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="index.html">Home</a></li>
              <li class="breadcrumb-item">
                <a href="products.html">Catalog</a>
              </li>
              <li
                class="breadcrumb-item active"
                aria-current="page"
                id="breadcrumbTitle"
              >
                Chi tiết sản phẩm
              </li>
            </ol>
          </nav>
        </div>
      </div>

      <div class="row g-4" id="productDetail">
        <!-- Product detail will be loaded here -->
      </div>

      <div class="row mt-5">
        <div class="col-12">
          <h3 class="mb-4">Sản phẩm tương tự</h3>
          <div class="row g-3" id="similarProducts">
            <!-- Similar products will be loaded here -->
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
      function formatPrice(value) {
        return Number(value).toLocaleString("vi-VN") + "đ";
      }

      function getQueryParam(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      function renderProductDetail() {
        const productId = getQueryParam("id");
        if (!productId) {
          document.getElementById("productDetail").innerHTML = `
            <div class="col-12">
              <div class="alert alert-warning">
                Không tìm thấy sản phẩm.
                <a href="products.html" class="alert-link">Quay lại catalog</a>
              </div>
            </div>
          `;
          return;
        }

        const gears = JSON.parse(localStorage.getItem("gears")) || [];
        const product = gears.find((g) => g.id === productId);

        if (!product) {
          document.getElementById("productDetail").innerHTML = `
            <div class="col-12">
              <div class="alert alert-danger">
                Sản phẩm không tồn tại.
                <a href="products.html" class="alert-link">Quay lại catalog</a>
              </div>
            </div>
          `;
          return;
        }

        document.getElementById("breadcrumbTitle").textContent = product.title;

        const specs = product.specs || {
          "Thương hiệu": "GearHub",
          "Bảo hành": "12 tháng",
          "Xuất xứ": "Việt Nam",
          "Tình trạng": product.quantity > 0 ? "Còn hàng" : "Hết hàng",
        };

        document.getElementById("productDetail").innerHTML = `
          <div class="col-md-6">
            <div class="card shadow-sm border-0">
              <div class="card-body text-center">
                <img src="${product.image}" alt="${product.title}" class="img-fluid rounded" style="max-height: 400px; object-fit: contain; background: #fff;" />
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card shadow-sm border-0">
              <div class="card-header bg-primary text-white">
                <h4 class="mb-0">${product.title}</h4>
              </div>
              <div class="card-body">
                <div class="mb-3">
                  <span class="badge bg-primary">${product.category}</span>
                  ${product.quantity > 0 ? '<span class="badge bg-success ms-2">Còn hàng</span>' : '<span class="badge bg-danger ms-2">Hết hàng</span>'}
                </div>
                <div class="mb-3">
                  <h3 class="text-danger fw-bold">${formatPrice(product.price)}</h3>
                  <small class="text-muted">Số lượng còn: ${product.quantity}</small>
                </div>
                <div class="mb-4">
                  <h5>Thông số kỹ thuật</h5>
                  <table class="table table-sm">
                    <tbody>
                      ${Object.entries(specs)
                        .map(
                          ([key, value]) => `
                        <tr>
                          <td class="fw-semibold">${key}</td>
                          <td>${value}</td>
                        </tr>
                      `,
                        )
                        .join("")}
                    </tbody>
                  </table>
                </div>
                <div class="mb-4">
                  <h5>Mô tả</h5>
                  <p>${product.description}</p>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-outline-primary flex-fill" onclick="addToCart('${product.id}')" ${product.quantity <= 0 ? "disabled" : ""}>
                    <i class="fas fa-cart-plus me-1"></i>Thêm giỏ
                  </button>
                  <button class="btn btn-success flex-fill" onclick="buyNow('${product.id}')" ${product.quantity <= 0 ? "disabled" : ""}>
                    <i class="fas fa-bolt me-1"></i>Mua ngay
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;

        renderSimilarProducts(product.category, product.id);
      }

      function renderSimilarProducts(category, excludeId) {
        const gears = JSON.parse(localStorage.getItem("gears")) || [];
        const similar = gears
          .filter((g) => g.category === category && g.id !== excludeId)
          .slice(0, 4);

        document.getElementById("similarProducts").innerHTML = similar.length
          ? similar
              .map(
                (gear) => `
          <div class="col-md-3 col-sm-6">
            <div class="card h-100 shadow-sm border-0">
              <img src="${gear.image}" class="card-img-top" style="height: 200px; object-fit: contain; background: #fff;" alt="${gear.title}">
              <div class="card-body d-flex flex-column">
                <h6 class="card-title">${gear.title}</h6>
                <p class="text-danger fw-bold mb-2">${formatPrice(gear.price)}</p>
                <a href="product-detail.html?id=${gear.id}" class="btn btn-outline-primary btn-sm mt-auto">Xem chi tiết</a>
              </div>
            </div>
          </div>
        `,
              )
              .join("")
          : `
          <div class="col-12">
            <div class="alert alert-info">Không có sản phẩm tương tự.</div>
          </div>
        `;
      }

      function addToCart(id) {
        if (!isLoggedIn()) {
          showLoginModal();
          return;
        }
        const gears = JSON.parse(localStorage.getItem("gears")) || [];
        const gear = gears.find((g) => g.id === id);
        if (!gear) return;
        if (gear.quantity <= 0) return alert("Sản phẩm đã hết hàng!");
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const exist = cart.find((i) => i.id === id);
        if (exist) {
          if (exist.quantity + 1 > gear.quantity)
            return alert(`Chỉ còn ${gear.quantity} sản phẩm!`);
          exist.quantity++;
        } else {
          cart.push({
            id,
            title: gear.title,
            price: gear.price,
            image: gear.image,
            quantity: 1,
          });
        }
        localStorage.setItem("cart", JSON.stringify(cart));
        updateCartCount();
      }

      function buyNow(id) {
        if (!isLoggedIn()) {
          showLoginModal();
          return;
        }
        addToCart(id);
        window.location.href = "order.html?checkout=1";
      }

      function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const cartCount = document.getElementById("cartCount");
        if (cartCount) {
          const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
          cartCount.textContent = totalItems;
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        renderProductDetail();
        updateCartCount();
        updateWarehouseLink();
      });
    </script>
  </body>
</html>
